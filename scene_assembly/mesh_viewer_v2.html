<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJ Mesh Axis Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 1rem;
            background-color: #1f2937;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: bold;
        }
        .button-group {
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #374151;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .sidebar {
            width: 320px;
            background-color: #1f2937;
            padding: 1rem;
            overflow-y: auto;
            border-left: 1px solid #374151;
        }
        .sidebar h2 {
            font-size: 1.125rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .axis-reference {
            margin-bottom: 1.5rem;
        }
        .axis-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .color-box {
            width: 1rem;
            height: 1rem;
        }
        .error {
            background-color: #7f1d1d;
            border: 1px solid #991b1b;
            border-radius: 0.25rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .info-section {
            margin-bottom: 1rem;
        }
        .info-section h2 {
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
        }
        .info-item {
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }
        .bbox-section {
            background-color: #111827;
            padding: 0.5rem;
            border-radius: 0.25rem;
            margin-bottom: 0.5rem;
            font-family: monospace;
            font-size: 0.875rem;
        }
        .bbox-section .label {
            color: #9ca3af;
        }
        .tip {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #1e3a8a;
            border: 1px solid #1e40af;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .tip .tip-title {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        .instructions {
            color: #9ca3af;
            font-size: 0.875rem;
        }
        .instructions ul {
            list-style-position: inside;
            margin-top: 0.5rem;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>OBJ Mesh Axis Viewer</h1>
            <div class="button-group">
                <label class="btn btn-primary">
                    <span>📤</span>
                    Load OBJ
                    <input type="file" id="fileInput" accept=".obj">
                </label>
                <button id="resetBtn" class="btn btn-secondary">
                    <span>🔄</span>
                    Reset View
                </button>
                <button id="saveBtn" class="btn btn-secondary">
                    <span>💾</span>
                    Save Image
                </button>
                <button id="toggleGridBtn" class="btn btn-secondary">
                    <span>👁️</span>
                    Hide Grid/Axes
                </button>
            </div>
        </div>
        <div class="content">
            <div id="canvas-container"></div>
            <div class="sidebar">
                <h2>Axis Reference</h2>
                <div class="axis-reference">
                    <div class="axis-item">
                        <div class="color-box" style="background-color: #ef4444;"></div>
                        <span>+X (Red)</span>
                    </div>
                    <div class="axis-item">
                        <div class="color-box" style="background-color: #22c55e;"></div>
                        <span>+Y (Green) - UP</span>
                    </div>
                    <div class="axis-item">
                        <div class="color-box" style="background-color: #3b82f6;"></div>
                        <span>+Z (Blue)</span>
                    </div>
                </div>
                <div id="errorContainer"></div>
                <div id="infoContainer">
                    <div class="instructions">
                        <p>Load an OBJ file to view its axes and bounding box information.</p>
                        <p style="margin-top: 0.5rem;">Controls:</p>
                        <ul>
                            <li>Drag to rotate</li>
                            <li>Scroll to zoom</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let gridVisible = true;
        let gridHelper, axisObjects = [];
        let objectBoundingBox = null;

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Grid helper
            gridHelper = new THREE.GridHelper(10, 10, 0xcccccc, 0xe0e0e0);
            scene.add(gridHelper);

            // Create axis helpers
            createAxis(0xff0000, [1, 0, 0], '+X');
            createAxis(0x00ff00, [0, 1, 0], '+Y');
            createAxis(0x0000ff, [0, 0, 1], '+Z');

            // Mouse controls
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('wheel', handleWheel);

            // Window resize
            window.addEventListener('resize', handleResize);

            // Animation loop
            animate();
        }

        function createAxis(color, direction, label) {
            const length = 3;
            const origin = new THREE.Vector3(0, 0, 0);
            const dest = new THREE.Vector3(...direction).multiplyScalar(length);

            const arrowHelper = new THREE.ArrowHelper(
                new THREE.Vector3(...direction),
                origin,
                length,
                color,
                0.3,
                0.2
            );
            scene.add(arrowHelper);
            axisObjects.push(arrowHelper);

            // Add text label using a sprite
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 128;
            context.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
            context.font = 'Bold 80px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(label, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(dest).multiplyScalar(1.15);
            sprite.scale.set(0.5, 0.5, 1);
            scene.add(sprite);
            axisObjects.push(sprite);
        }

        function handleMouseDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function handleMouseMove(e) {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            rotation.y += deltaX * 0.01;
            rotation.x += deltaY * 0.01;

            const radius = Math.sqrt(
                camera.position.x ** 2 +
                camera.position.y ** 2 +
                camera.position.z ** 2
            );

            camera.position.x = radius * Math.sin(rotation.y) * Math.cos(rotation.x);
            camera.position.y = radius * Math.sin(rotation.x);
            camera.position.z = radius * Math.cos(rotation.y) * Math.cos(rotation.x);

            camera.lookAt(0, 0, 0);
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function handleMouseUp() {
            isDragging = false;
        }

        function handleWheel(e) {
            e.preventDefault();
            const zoomSpeed = 0.1;
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            camera.position.addScaledVector(direction, -e.deltaY * zoomSpeed * 0.01);
        }

        function handleResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function parseOBJ(text) {
            const vertices = [];
            const faces = [];
            const lines = text.split('\n');

            for (const line of lines) {
                const parts = line.trim().split(/\s+/);
                if (parts[0] === 'v') {
                    vertices.push([
                        parseFloat(parts[1]),
                        parseFloat(parts[2]),
                        parseFloat(parts[3])
                    ]);
                } else if (parts[0] === 'f') {
                    const face = parts.slice(1).map(p => {
                        const indices = p.split('/');
                        return parseInt(indices[0]) - 1;
                    });
                    if (face.length >= 3) {
                        faces.push(face);
                    }
                }
            }

            return { vertices, faces };
        }

        function loadOBJ(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const { vertices, faces } = parseOBJ(text);

                    if (vertices.length === 0) {
                        throw new Error('No vertices found in OBJ file');
                    }

                    // Create Three.js geometry
                    const geometry = new THREE.BufferGeometry();
                    const positionArray = new Float32Array(vertices.flat());
                    geometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3));

                    // Add vertex colors based on position for pleasant visualization
                    const colors = [];
                    for (let i = 0; i < vertices.length; i++) {
                        const v = vertices[i];
                        // Create soft pastel colors based on normalized position
                        const r = 0.5 + Math.sin(v[0] * 0.5) * 0.3;
                        const g = 0.5 + Math.sin(v[1] * 0.5 + 2) * 0.3;
                        const b = 0.5 + Math.sin(v[2] * 0.5 + 4) * 0.3;
                        colors.push(r, g, b);
                    }
                    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));

                    const indices = [];
                    for (const face of faces) {
                        if (face.length === 3) {
                            indices.push(...face);
                        } else if (face.length === 4) {
                            indices.push(face[0], face[1], face[2]);
                            indices.push(face[0], face[2], face[3]);
                        }
                    }
                    geometry.setIndex(indices);
                    geometry.computeVertexNormals();

                    // Calculate bounding box
                    geometry.computeBoundingBox();
                    const bbox = geometry.boundingBox;
                    const center = new THREE.Vector3();
                    bbox.getCenter(center);
                    const size = new THREE.Vector3();
                    bbox.getSize(size);

                    // Store bounding box for camera positioning
                    objectBoundingBox = { center, size };

                    // Remove previous mesh if exists
                    const oldMesh = scene.getObjectByName('loadedMesh');
                    if (oldMesh) {
                        scene.remove(oldMesh);
                        oldMesh.geometry.dispose();
                        oldMesh.material.dispose();
                    }

                    const oldBox = scene.getObjectByName('boundingBox');
                    if (oldBox) {
                        scene.remove(oldBox);
                        oldBox.geometry.dispose();
                        oldBox.material.dispose();
                    }

                    // Create mesh with proper centering
                    const material = new THREE.MeshStandardMaterial({
                        vertexColors: true,
                        metalness: 0.2,
                        roughness: 0.6,
                        side: THREE.DoubleSide
                    });

                    geometry.translate(-center.x, -center.y, -center.z);
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.name = 'loadedMesh';
                    scene.add(mesh);

                    // Reset camera to nice isometric view
                    resetCamera();

                    // Display info
                    displayMeshInfo({
                        vertices: vertices.length,
                        faces: faces.length,
                        bbox: {
                            min: { x: bbox.min.x, y: bbox.min.y, z: bbox.min.z },
                            max: { x: bbox.max.x, y: bbox.max.y, z: bbox.max.z },
                            size: { x: size.x, y: size.y, z: size.z },
                            center: { x: center.x, y: center.y, z: center.z }
                        }
                    });

                    clearError();
                } catch (err) {
                    showError(err.message);
                    console.error('Error loading OBJ:', err);
                }
            };
            reader.readAsText(file);
        }

        function displayMeshInfo(info) {
            const container = document.getElementById('infoContainer');
            container.innerHTML = `
                <div class="info-section">
                    <h2>Mesh Info</h2>
                    <div class="info-item">Vertices: ${info.vertices}</div>
                    <div class="info-item">Faces: ${info.faces}</div>
                </div>
                <div class="info-section">
                    <h2>Bounding Box</h2>
                    <div class="bbox-section">
                        <div class="label">Min:</div>
                        <div>X: ${info.bbox.min.x.toFixed(3)}</div>
                        <div>Y: ${info.bbox.min.y.toFixed(3)}</div>
                        <div>Z: ${info.bbox.min.z.toFixed(3)}</div>
                    </div>
                    <div class="bbox-section">
                        <div class="label">Max:</div>
                        <div>X: ${info.bbox.max.x.toFixed(3)}</div>
                        <div>Y: ${info.bbox.max.y.toFixed(3)}</div>
                        <div>Z: ${info.bbox.max.z.toFixed(3)}</div>
                    </div>
                    <div class="bbox-section">
                        <div class="label">Size:</div>
                        <div>X: ${info.bbox.size.x.toFixed(3)}</div>
                        <div>Y: ${info.bbox.size.y.toFixed(3)}</div>
                        <div>Z: ${info.bbox.size.z.toFixed(3)}</div>
                    </div>
                    <div class="bbox-section">
                        <div class="label">Center:</div>
                        <div>X: ${info.bbox.center.x.toFixed(3)}</div>
                        <div>Y: ${info.bbox.center.y.toFixed(3)}</div>
                        <div>Z: ${info.bbox.center.z.toFixed(3)}</div>
                    </div>
                    <div class="tip">
                        <div class="tip-title">Tip:</div>
                        <div>Compare the size values to determine forward direction. The largest dimension after Y (up) is typically forward.</div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `<div class="error">Error: ${message}</div>`;
        }

        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        function resetCamera() {
            if (objectBoundingBox) {
                const { size } = objectBoundingBox;
                const maxDim = Math.max(size.x, size.y, size.z);
                const distance = maxDim * 1.8;

                // Position between -z and +x, quarter closer to -z, little higher on +y
                const angle = Math.PI / 6; // 30 degrees from -z towards +x
                camera.position.x = distance * Math.sin(angle);
                camera.position.y = distance * 0.4; // Slightly elevated
                camera.position.z = -distance * Math.cos(angle);

                camera.lookAt(0, 0, 0);

                // Update rotation tracking for mouse controls
                rotation.y = angle;
                rotation.x = Math.asin(camera.position.y / distance);
            } else {
                // Default position if no object loaded
                camera.position.set(3, 2, -4);
                camera.lookAt(0, 0, 0);
            }
        }

        function saveImage() {
            // Get the mesh to calculate tight crop
            const mesh = scene.getObjectByName('loadedMesh');
            if (!mesh) {
                alert('No mesh loaded to save!');
                return;
            }

            // Create temporary canvas for cropped image
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            // Render current view
            renderer.render(scene, camera);

            // Get the canvas
            const canvas = renderer.domElement;

            // Calculate bounding box in screen space
            const bbox = new THREE.Box3().setFromObject(mesh);
            const corners = [
                new THREE.Vector3(bbox.min.x, bbox.min.y, bbox.min.z),
                new THREE.Vector3(bbox.min.x, bbox.min.y, bbox.max.z),
                new THREE.Vector3(bbox.min.x, bbox.max.y, bbox.min.z),
                new THREE.Vector3(bbox.min.x, bbox.max.y, bbox.max.z),
                new THREE.Vector3(bbox.max.x, bbox.min.y, bbox.min.z),
                new THREE.Vector3(bbox.max.x, bbox.min.y, bbox.max.z),
                new THREE.Vector3(bbox.max.x, bbox.max.y, bbox.min.z),
                new THREE.Vector3(bbox.max.x, bbox.max.y, bbox.max.z)
            ];

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            corners.forEach(corner => {
                const projected = corner.project(camera);
                const x = (projected.x + 1) / 2 * canvas.width;
                const y = (1 - projected.y) / 2 * canvas.height;
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            });

            // Add padding (10% on each side)
            const padding = Math.max((maxX - minX), (maxY - minY)) * 0.1;
            minX = Math.max(0, minX - padding);
            minY = Math.max(0, minY - padding);
            maxX = Math.min(canvas.width, maxX + padding);
            maxY = Math.min(canvas.height, maxY + padding);

            const cropWidth = maxX - minX;
            const cropHeight = maxY - minY;

            // Set temp canvas size
            tempCanvas.width = cropWidth;
            tempCanvas.height = cropHeight;

            // Draw cropped portion
            tempCtx.drawImage(
                canvas,
                minX, minY, cropWidth, cropHeight,
                0, 0, cropWidth, cropHeight
            );

            // Convert to blob and download
            tempCanvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'mesh-view-' + new Date().getTime() + '.png';
                link.click();
                URL.revokeObjectURL(url);
            });
        }

        function toggleGridAndAxes() {
            gridVisible = !gridVisible;

            // Toggle grid
            if (gridHelper) {
                gridHelper.visible = gridVisible;
            }

            // Toggle all axis objects
            axisObjects.forEach(obj => {
                obj.visible = gridVisible;
            });

            // Update button text
            const btn = document.getElementById('toggleGridBtn');
            btn.innerHTML = gridVisible
                ? '<span>👁️</span> Hide Grid/Axes'
                : '<span>👁️</span> Show Grid/Axes';
        }

        // Event listeners
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                loadOBJ(file);
            }
        });

        document.getElementById('resetBtn').addEventListener('click', resetCamera);

        document.getElementById('saveBtn').addEventListener('click', saveImage);

        document.getElementById('toggleGridBtn').addEventListener('click', toggleGridAndAxes);

        // Initialize
        init();
    </script>
</body>
</html>
